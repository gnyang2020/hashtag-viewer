name: 주간 카카오 해시태그 데이터 갱신

on:
  schedule:
    - cron: '0 1 * * 3'   # UTC 수 01:00 = KST 수 10:00 (매주 수요일 오전 10시)
  workflow_dispatch:         # 수동 실행 버튼도 허용

permissions:
  contents: write            # data.json 커밋을 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 크롤은 한 번만. data.json(인기 분석) · insight.json(인사이트) · history/<날짜>.json을 함께 만든다.
      - name: 데이터 수집
        run: node scrape.mjs

      # 누적된 스냅샷을 프런트가 한 번에 받을 수 있게 병합 → public/history.json
      - name: 시계열 병합
        run: node build-history.mjs

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/insight.json public/history.json history cache
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 데이터 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
            git push
          fi
